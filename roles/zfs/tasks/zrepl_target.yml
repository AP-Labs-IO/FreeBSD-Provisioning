---
- name: Import local base computation
  ansible.builtin.include_tasks:
    file: local_base.yml
  when: ansible_facts['local_base'] is not defined

- name: Install replication SSH public key
  ansible.posix.authorized_key:
    user: "{{ zfs_replication_user.name }}"
    key_options: 'command="{{ ansible_facts["local_base"] }}/bin/zrepl stdinserver {{ hostvars[host]["ansible_facts"]["hostname"] }}",restrict'
    key: "{{ hostvars[host]['zfs_reg_replication_pubkey']['content'] | b64decode }}"
  loop: "{{ groups['all'] | difference([inventory_hostname]) }}"
  loop_control:
    loop_var: host
  tags: [replication, ssh, config]

- name: Create replication target dataset
  community.general.zfs:
    name: "{{ zfs_replication_target_dataset }}"
    state: present
    extra_zfs_properties:
      mountpoint: none
  tags: [replication, dataset]

- name: Configure target ZFS delegation for replication
  community.general.zfs_delegate_admin:
    name: "{{ zfs_replication_target_dataset }}"
    users:
      - "{{ zfs_replication_user.name }}"
    permissions: "{{ zfs_replication_target_delegated_permissions | join(',') }}"
    state: present
  tags: [snapshotting, replication, delegation]

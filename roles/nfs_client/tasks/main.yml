---
- name: Configure NFS client
  notify: Restart NFS client
  tags: [client, config]
  block:
    - name: Set NFS access cache
      community.general.sysrc:
        name: nfs_access_cache
        state: present
        value: "{{ nfs_client_access_cache }}"

    - name: Set NFS buffer packets
      community.general.sysrc:
        name: nfs_bufpackets
        state: present
        value: "{{ nfs_client_bufpackets }}"

- name: Configure base kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    state: present
    value: "{{ item.value }}"
  loop:
    - key: vfs.nfs.enable_uidtostring
      value: 1
      description: Send numeric owner_names
  loop_control:
    label: "{{ item.description }}: {{ item.key }} -> {{ item.value }}"
  tags: [kernel, config]

- name: Configure extra kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    state: present
    value: "{{ item.value }}"
  loop: "{{ nfs_client_extra_kernel_settings }}"
  loop_control:
    label: "{{ item.description ~ ': ' if item.description is defined else '' }}{{ item.key }} -> {{ item.value }}"
  tags: [kernel, config]

- name: Mount NFS shares
  ansible.posix.mount:
    fstype: nfs
    src: "{{ item.host }}:{{ item.src }}"
    path: "{{ item.path }}"
    opts: "{{ item.opts }}"
    state: mounted
  loop: "{{ nfs_client_shares }}"
  loop_control:
    label: "{{ item.host }}:{{ item.src }} -> {{ item.path }}"
  tags: [shares, mount, config]

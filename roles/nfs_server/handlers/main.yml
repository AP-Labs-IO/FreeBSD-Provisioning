---
- name: Reboot
  ansible.builtin.reboot:
    msg: Rebooting to load new settings
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5

- name: Restart nfsd
  ansible.builtin.service:
    name: nfsd
    enabled: true
    state: restarted

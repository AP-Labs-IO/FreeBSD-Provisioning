---
- name: Configure extra services monitoring
  when: (monitoring_extra_services | trim) | length > 0
  tags: [apprise, extra-services]
  block:
    - name: Install extra services monitoring script
      ansible.builtin.template:
        src: monitor-extra-services.j2
        dest: "{{ monitoring_installation_path }}/monitor-extra-services"
        owner: root
        group: wheel
        mode: "0755"
      tags: [script]

    - name: Install extra services monitoring alert job
      ansible.builtin.cron:
        name: Extra services monitoring alert
        cron_file: "{{ ansible_facts['local_base'] }}/etc/cron.d/alert-extra-services"
        minute: "{{ monitoring_extra_services_monitoring_schedule.minute | default(omit) }}"
        hour: "{{ monitoring_extra_services_monitoring_schedule.hour | default(omit) }}"
        day: "{{ monitoring_extra_services_monitoring_schedule.day | default(omit) }}"
        weekday: "{{ monitoring_extra_services_monitoring_schedule.weekday | default(omit) }}"
        special_time: "{{ monitoring_extra_services_monitoring_schedule.special_time | default(omit) }}"
        user: root
        job: "{{ monitoring_installation_path }}/monitor-extra-services"
      tags: [cron]

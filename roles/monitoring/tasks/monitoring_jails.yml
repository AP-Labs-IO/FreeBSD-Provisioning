---
- name: Configure jails monitoring
  when: (monitoring_jails | trim) | length > 0
  tags: [apprise, jails]
  block:
    - name: Install jails monitoring script
      ansible.builtin.template:
        src: monitor-jails.j2
        dest: "{{ monitoring_installation_path }}/monitor-jails"
        owner: root
        group: wheel
        mode: "0755"
      tags: [script]

    - name: Install jails monitoring alert job
      ansible.builtin.cron:
        name: Jails monitoring alert
        cron_file: "{{ ansible_facts['local_base'] }}/etc/cron.d/alert-jails"
        minute: "{{ monitoring_jails_monitoring_schedule.minute | default(omit) }}"
        hour: "{{ monitoring_jails_monitoring_schedule.hour | default(omit) }}"
        day: "{{ monitoring_jails_monitoring_schedule.day | default(omit) }}"
        weekday: "{{ monitoring_jails_monitoring_schedule.weekday | default(omit) }}"
        special_time: "{{ monitoring_jails_monitoring_schedule.special_time | default(omit) }}"
        user: root
        job: "{{ monitoring_installation_path }}/monitor-jails"
      tags: [cron]

---
- name: Apply OS patches (freebsd-update)
  ansible.builtin.command: freebsd-update --not-running-from-cron fetch install
  environment:
    PAGER: cat
  register: patch_reg_patches
  when: not patch_freebsd_15_or_newer
  changed_when: patch_reg_patches.stdout is search('(?i)installing.*updates')
  failed_when:
    - patch_reg_patches.rc != 0
    - "'No updates needed' not in patch_reg_patches.stdout"
  notify: Reboot
  tags: [patch]

- name: Update base packages (pkgbase)
  community.general.pkgng:
    pkgsite: FreeBSD-base
    name: "*"
    state: latest
  notify: Reboot
  when: patch_freebsd_15_or_newer
  tags: [patch]

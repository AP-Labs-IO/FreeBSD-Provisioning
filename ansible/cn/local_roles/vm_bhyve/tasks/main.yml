---
- name: Load the bhyve kernel module
  community.general.sysrc:
    name: vmm_load
    state: present
    value: "YES"
    path: /boot/loader.conf
  register: vm_bhyve_reg_kernel_module
  tags: [bhyve, module, config]

- name: Reserve PCI passthrough devices
  community.general.sysrc:
    name: pptdevs
    state: "{{ (vm_bhyve_passthrough_devices | length > 0) | ternary('present', 'absent') }}"
    value: "{{ vm_bhyve_passthrough_devices | join(' ') }}"
    path: /boot/loader.conf
  register: vm_bhyve_reg_passthrough_devs
  tags: [kernel, config, modules]

- name: Expose zvols as device files
  ansible.posix.sysctl:
    name: vfs.zfs.vol.mode
    state: present
    value: 2
    sysctl_file: /boot/loader.conf
    reload: false
  register: vm_bhyve_reg_zvols
  tags: [config, zvols]

- name: Enable automatic tap device activation
  ansible.posix.sysctl:
    name: net.link.tap.up_on_open
    state: present
    value: 1
  tags: [tap, config]

- name: Install vm-bhyve packages
  community.general.pkgng:
    name:
      - sysutils/vm-bhyve
      - sysutils/bhyve-firmware
      - sysutils/edk2@bhyve
      - sysutils/tmux
    state: latest
    use_globs: false
  tags: [pkg]

- name: Enable vm-bhyve
  community.general.sysrc:
    name: vm_enable
    state: present
    value: "YES"
  tags: [enable, config]

- name: Disable system support checks
  community.general.sysrc:
    name: vm_disable_host_checks
    state: "{{ (vm_bhyve_host_checks_disabled == true) | ternary('present', 'absent') }}"
    value: "YES"
  tags: [support, checks, config]

- name: Configure vm-bhyve dataset
  community.general.sysrc:
    name: vm_dir
    state: present
    value: "zfs:{{ vm_bhyve_dataset }}"
  tags: [dataset, config]

- name: Create vm-bhyve dataset
  community.general.zfs:
    name: "{{ vm_bhyve_dataset }}"
    state: present
  tags: [dataset, config]

- name: Configure startup VMs
  community.general.sysrc:
    name: vm_list
    state: "{{ (vm_bhyve_startup_vms | length > 0) | ternary('present', 'absent') }}"
    value: "{{ vm_bhyve_startup_vms | join(' ') }}"
  tags: [vms, startup, config]

- name: Configure VM startup delay
  community.general.sysrc:
    name: vm_delay
    state: present
    value: "{{ vm_bhyve_startup_delay }}"
  tags: [vms, startup, delay, config]

- name: Reboot
  ansible.builtin.reboot:
    msg: Rebooting to load new settings
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
  when: >
    (vm_bhyve_reg_kernel_module.changed | default(false) | bool) or
    (vm_bhyve_reg_passthrough_devs.changed | default(false) | bool) or
    (vm_bhyve_reg_zvols.changed | default(false) | bool)
  tags: [reboot]

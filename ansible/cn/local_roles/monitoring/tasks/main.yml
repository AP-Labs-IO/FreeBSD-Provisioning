---
- name: Load monitoring kernel modules
  community.general.sysrc:
    name: "{{ item }}_load"
    state: present
    value: "YES"
    path: /boot/loader.conf
  loop:
    - ipmi
    - coretemp
  notify: Reboot
  tags: [kernel, config, modules]

- name: Configure watchdogd flags
  community.general.sysrc:
    name: watchdogd_flags
    state: present
    value: "{{ monitoring_watchdogd_flags }}"
  tags: [watchdog, config]

- name: Start watchdogd
  ansible.builtin.service:
    name: watchdogd
    enabled: true
    state: started
  tags: [watchdog, service]

- name: Install monitoring packages
  community.general.pkgng:
    name: "{{ item }}"
    state: latest
    use_globs: false
  loop:
    - net/ifstat
    - net-im/py-apprise
    - net-mgmt/collectd5
    - net-mgmt/iftop
    - sysutils/freeipmi
    - sysutils/ipmitool
    - sysutils/smartmontools
    - textproc/jq
  tags: [pkg]

- name: Install smartd configuration
  ansible.builtin.template:
    src: usr/local/etc/smartd.conf.j2
    dest: /usr/local/etc/smartd.conf
    owner: root
    group: wheel
    mode: "0644"
  tags: [smartd, config]

- name: Configure smartd flags
  community.general.sysrc:
    name: smartd_flags
    state: present
    value: "-q never -i {{ monitoring_smartd_poll_interval }}"
  tags: [smartd]

- name: Start smartd
  ansible.builtin.service:
    name: smartd
    enabled: true
    state: started
  tags: [smartd, service]

- name: Install collectd configuration
  ansible.builtin.template:
    src: usr/local/etc/collectd.conf.j2
    dest: /usr/local/etc/collectd.conf
    owner: root
    group: wheel
    mode: "0644"
  tags: [collectd, config]

- name: Install CPU temperature script
  ansible.builtin.copy:
    src: collectd-cputemp
    dest: /usr/local/bin/ap-collectd-cputemp
    owner: root
    group: wheel
    mode: "0755"
  tags: [collectd, script]

- name: Start collectdmon
  ansible.builtin.service:
    name: collectdmon
    enabled: true
    state: started
  tags: [collectd, service]

- name: Install apprise configuration
  ansible.builtin.template:
    src: root/apprise.yml.j2
    dest: /root/.apprise.yml
    owner: root
    group: wheel
    mode: "0600"
  tags: [apprise, config]

- name: Install system reboot alert job
  ansible.builtin.cron:
    name: System bootup alert
    cron_file: /usr/local/etc/cron.d/alert-reboot
    special_time: reboot
    user: root
    job:
      "/usr/local/bin/apprise \
        --tag system_reboot \
        --notification-type INFO \
        --title '{{ ansible_facts['fqdn'] }} - Bootup notification' \
        --body '{{ ansible_facts['fqdn'] }}: bootup complete.'"
  tags: [apprise, alert, boot, cron]

- name: Install IPMI monitoring script
  ansible.builtin.copy:
    src: monitor-ipmi
    dest: /usr/local/bin/ap-monitor-ipmi
    owner: root
    group: wheel
    mode: "0755"
  tags: [apprise, ipmi, script]

- name: Install IPMI monitoring alert job
  ansible.builtin.cron:
    name: IPMI monitoring alert
    cron_file: /usr/local/etc/cron.d/alert-ipmi
    special_time: daily
    user: root
    job: /usr/local/bin/ap-monitor-ipmi
  tags: [apprise, alert, ipmi, cron]

- name: Install smartd alerts hook
  ansible.builtin.copy:
    dest: /usr/local/etc/smartd_warning.d/10-apprise-notify.sh
    owner: root
    group: wheel
    mode: "0755"
    content: |
      #!/bin/sh

      /usr/local/bin/apprise \
        --tag smartd \
        --notification-type CRITICAL \
        --title "$SMARTD_SUBJECT" \
        --body "$SMARTD_FULLMESSAGE"
  tags: [apprise, alert, smartd]

- name: Install SSH login failure alert script
  ansible.builtin.copy:
    src: ssh-alert
    dest: /usr/local/bin/ap-ssh-alert
    owner: root
    group: wheel
    mode: "0755"
  tags: [apprise, alert, ssh, security]

- name: Configure syslog SSH login failure alerts
  ansible.builtin.copy:
    dest: /usr/local/etc/syslog.d/ssh.conf
    owner: root
    group: wheel
    mode: "0644"
    content: |
      auth.info | /usr/local/bin/ap-ssh-alert
  notify: Reload syslogd
  tags: [syslog, alert, ssh, security]

- name: Install blocklistd configuration
  ansible.builtin.copy:
    src: blocklistd.conf
    dest: /usr/local/etc/blocklistd.conf
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart blocklistd
  tags: [blocklistd, config, security]

- name: Configure blocklistd flags
  community.general.sysrc:
    name: blocklistd_flags
    state: present
    value: "-c /usr/local/etc/blocklistd.conf"
  notify: Restart blocklistd
  tags: [blocklistd, config, security]

- name: Enable SSH blocklistd integration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?UseBlocklist"
    line: UseBlocklist yes
  notify: Restart sshd
  tags: [ssh, config, blocklistd, security]

- name: Install pf blocklistd rules
  ansible.builtin.copy:
    src: pf.conf
    dest: /etc/pf.conf
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart pf
  tags: [monitoring, security, firewall]

- name: Install services monitoring script
  ansible.builtin.copy:
    src: monitor-services
    dest: /usr/local/bin/ap-monitor-services
    owner: root
    group: wheel
    mode: "0755"
  tags: [apprise, services, script]

- name: Install services monitoring alert job
  ansible.builtin.cron:
    name: Services monitoring alert
    cron_file: /usr/local/etc/cron.d/alert-services
    minute: "*/5"
    user: root
    job: /usr/local/bin/ap-monitor-services
  tags: [apprise, alert, services, cron]

- name: Install jails monitoring infrastructure
  tags: [jail-monitoring, never]
  block:
    - name: Install jails monitoring script
      ansible.builtin.copy:
        src: monitor-jails
        dest: /usr/local/bin/ap-monitor-jails
        owner: root
        group: wheel
        mode: "0755"

    - name: Install jails monitoring alert job
      ansible.builtin.cron:
        name: Jails monitoring alert
        cron_file: /usr/local/etc/cron.d/alert-jails
        minute: "*/5"
        user: root
        job: /usr/local/bin/ap-monitor-jails

---
- name: Configure extra services monitoring
  when: (monitoring_extra_services | trim) | length > 0
  tags: [apprise, extra-services]
  block:
    - name: Install extra services monitoring script
      ansible.builtin.template:
        src: usr/local/bin/monitor-extra-services.j2
        dest: /usr/local/bin/ap-monitor-extra-services
        owner: root
        group: wheel
        mode: "0755"
      tags: [script]

    - name: Install extra services monitoring alert job
      ansible.builtin.cron:
        name: Extra services monitoring alert
        cron_file: /usr/local/etc/cron.d/alert-extra-services
        minute: "*/5"
        user: root
        job: /usr/local/bin/ap-monitor-extra-services
      tags: [cron]

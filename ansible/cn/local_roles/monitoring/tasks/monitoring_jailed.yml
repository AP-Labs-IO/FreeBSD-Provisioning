---
- name: Configure jails monitoring
  when: (monitoring_jails | trim) | length > 0
  tags: [apprise, jails]
  block:
    - name: Install jails monitoring script
      ansible.builtin.template:
        src: usr/local/bin/monitor-jails.j2
        dest: /usr/local/bin/ap-monitor-jails
        owner: root
        group: wheel
        mode: "0755"
      tags: [script]

    - name: Install jails monitoring alert job
      ansible.builtin.cron:
        name: Jails monitoring alert
        cron_file: /usr/local/etc/cron.d/alert-jails
        minute: "*/5"
        user: root
        job: /usr/local/bin/ap-monitor-jails
      tags: [cron]

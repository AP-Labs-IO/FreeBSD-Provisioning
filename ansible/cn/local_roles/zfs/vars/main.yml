---
zfs_replication_key_basename: "replication-{{ zfs_replication_target_host | replace('.', '_') }}"
zfs_replication_datasets: "{{ (zfs_hourly_snapshots_datasets | default([])) + (zfs_nightly_snapshots_datasets | default([])) }}"
zfs_replication_source_delegated_permissions:
  - snapshot
  - mount
  - bookmark
  - send
  - hold
  - release
  - destroy
zfs_replication_target_delegated_permissions:
  - create
  - userprop
  - mountpoint
  - receive
  - readonly
  - canmount
  - compression
  - mount
  - rollback
  - hold
  - release
  - destroy

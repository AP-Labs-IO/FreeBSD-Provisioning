---
zfs_replication_user:
  name: replicator
  uid: 981
  group: replicator
zfs_replication_key_basename: "replication-{{ zfs_replication_target_host | replace('.', '_') }}"
zfs_replication_source_delegated_permissions:
  - snapshot
  - mount
  - bookmark
  - send
  - hold
  - release
  - destroy
zfs_replication_target_delegated_permissions:
  - create
  - userprop
  - mountpoint
  - receive
  - readonly
  - canmount
  - compression
  - mount
  - rollback
  - hold
  - release
  - destroy

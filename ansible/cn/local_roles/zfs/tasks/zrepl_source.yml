---
- name: Configure ZFS delegation
  community.general.zfs_delegate_admin:
    name: "{{ item }}"
    users:
      - "{{ zfs_replication_user }}"
    permissions: "{{ zfs_replication_source_delegated_permissions | join(',') }}"
    state: present
  loop: "{{ (zfs_hourly_snapshots_datasets | default([])) + (zfs_nightly_snapshots_datasets | default([])) }}"
  tags: [snapshotting, replication, delegation]

- name: Create replication user SSH directory
  ansible.builtin.file:
    path: "/home/{{ zfs_replication_user }}/.ssh"
    state: directory
    owner: "{{ zfs_replication_user }}"
    group: "{{ zfs_replication_group }}"
    mode: "0700"
  tags: [replication, ssh]

- name: Generate replication SSH key
  community.crypto.openssh_keypair:
    path: "/home/{{ zfs_replication_user }}/.ssh/{{ zfs_replication_key_basename }}"
    type: ed25519
    comment: "{{ zfs_replication_user }}@{{ ansible_facts['fqdn'] }}"
    owner: "{{ zfs_replication_user }}"
    group: "{{ zfs_replication_group }}"
    mode: "0400"
  tags: [replication, ssh, key]

- name: Retrieve replication SSH public key
  ansible.builtin.slurp:
    src: "/home/{{ zfs_replication_user }}/.ssh/{{ zfs_replication_key_basename }}.pub"
  register: zfs_reg_replication_pubkey
  tags: [replication, ssh, key]

- name: Install zrepl configuration
  ansible.builtin.template:
    src: usr/local/etc/zrepl/zrepl_source.yml.j2
    dest: /usr/local/etc/zrepl/zrepl.yml
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart zrepl
  tags: [snapshotting, replication, config]

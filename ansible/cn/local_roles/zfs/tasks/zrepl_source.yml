---
- name: Create replication user SSH directory
  ansible.builtin.file:
    path: "/home/{{ zfs_replication_user.name }}/.ssh"
    state: directory
    owner: "{{ zfs_replication_user.name }}"
    group: "{{ zfs_replication_user.group }}"
    mode: "0700"
  tags: [replication, ssh]

- name: Configure replication SSH key
  tags: [replication, ssh, key]
  block:
    - name: Generate replication SSH key
      community.crypto.openssh_keypair:
        path: "/home/{{ zfs_replication_user.name }}/.ssh/{{ zfs_replication_key_basename }}"
        type: ed25519
        comment: "{{ zfs_replication_user.name }}@{{ ansible_facts['fqdn'] }}"
        owner: "{{ zfs_replication_user.name }}"
        group: "{{ zfs_replication_user.group }}"
        mode: "0400"

    - name: Retrieve replication SSH public key
      ansible.builtin.slurp:
        src: "/home/{{ zfs_replication_user.name }}/.ssh/{{ zfs_replication_key_basename }}.pub"
      register: zfs_reg_replication_pubkey

- name: Copy replication host SSH public keys
  ansible.builtin.copy:
    src: "known_hosts_{{ zfs_replication_target_host }}"
    dest: "/home/{{ zfs_replication_user.name }}/.ssh/known_hosts"
    owner: "{{ zfs_replication_user.name }}"
    group: "{{ zfs_replication_user.group }}"
    mode: "0600"
  tags: [ssh, replication, host, keys]

- name: Create replication source datasets
  community.general.zfs:
    name: "{{ item }}"
    state: present
  loop: "{{ zfs_replication_datasets }}"
  tags: [replication, datasets]

- name: Configure source ZFS delegation for replication
  community.general.zfs_delegate_admin:
    name: "{{ item }}"
    users:
      - "{{ zfs_replication_user.name }}"
    permissions: "{{ zfs_replication_source_delegated_permissions | join(',') }}"
    state: present
  loop: "{{ zfs_replication_datasets }}"
  tags: [snapshotting, replication, delegation]

- name: Configure snapshotting & replication monitoring
  tags: [snapshotting, replication, monitoring]
  block:
    - name: Install snapshotting & replication monitoring script
      ansible.builtin.copy:
        src: monitor-replication
        dest: "{{ zfs_installation_path }}/monitor-replication"
        owner: root
        group: wheel
        mode: "0755"
      tags: [script]

    - name: Install snapshotting & replication monitoring alert job
      ansible.builtin.cron:
        name: ZFS snapshotting & replication monitoring alert
        cron_file: /usr/local/etc/cron.d/alert-replication
        minute: "*/15"
        user: root
        job: "{{ zfs_installation_path }}/monitor-replication"
      tags: [cron]

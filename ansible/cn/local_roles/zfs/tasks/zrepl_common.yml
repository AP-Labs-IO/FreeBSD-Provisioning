---
- name: Create replication group
  ansible.builtin.group:
    name: "{{ zfs_replication_user.group }}"
    gid: "{{ zfs_replication_user.gid }}"
  tags: [replication, group]

- name: Create replication user
  ansible.builtin.user:
    name: "{{ zfs_replication_user.name }}"
    uid: "{{ zfs_replication_user.uid }}"
    comment: ZFS replication user
    groups: "{{ zfs_replication_user.group }}"
    shell: /bin/sh
  tags: [replication, user]

- name: Install packages
  community.general.pkgng:
    name:
      - filesystems/zrepl
    state: latest
    use_globs: false
  tags: [zrepl, pkg]

- name: Install zrepl configuration
  ansible.builtin.template:
    src: usr/local/etc/zrepl/zrepl_{{ type }}.yml.j2
    dest: /usr/local/etc/zrepl/zrepl.yml
    owner: root
    group: wheel
    mode: "0644"
  vars:
    type: "{{ ('replication' in groups and inventory_hostname in groups['replication']) | ternary('target', 'source') }}"
  notify: Restart zrepl
  tags: [zrepl, config]

- name: Configure zrepl flags
  community.general.sysrc:
    name: "zrepl_{{ item.flag }}"
    state: present
    value: "{{ item.value }}"
  loop:
    - flag: user
      value: "{{ zfs_replication_user.name }}"
    - flag: group
      value: "{{ zfs_replication_user.group }}"
  loop_control:
    label: "zrepl_{{ item.flag }} -> {{ item.value }}"
  tags: [zrepl, config]

- name: Remove zrepl's syslog configuration
  ansible.builtin.file:
    path: /usr/local/etc/syslog.d/zrepl.conf
    state: absent
  notify: Reload syslogd
  tags: [zrepl, config]

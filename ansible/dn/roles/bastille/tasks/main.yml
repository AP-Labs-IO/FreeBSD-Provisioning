---
- name: Install Bastille packages
  community.general.pkgng:
    name:
      - devel/git
      - sysutils/bastille
      - sysutils/htop
    state: latest
  tags: [packages]

- name: Install Bastille configuration
  ansible.builtin.template:
    src: usr/local/etc/bastille/bastille.conf.j2
    dest: /usr/local/etc/bastille/bastille.conf
    owner: root
    group: wheel
    mode: "0644"
  tags: [config]

- name: Enable Bastille service
  community.general.sysrc:
    name: bastille_enable
    state: present
    value: "YES"
  tags: [config]

- name: Configure jail startup delay
  community.general.sysrc:
    name: bastille_startup_delay
    state: present
    value: 5
  tags: [config]

- name: Bootstrap FreeBSD releases
  ansible.builtin.command:
    cmd: "bastille bootstrap {{ item }} update"
    creates: "{{ bastille_prefix }}/releases/{{ item }}/COPYRIGHT"
  register: bastille_bootstrap_releases
  changed_when: "'skipped' not in bastille_bootstrap_releases.stdout"
  loop: "{{ bastille_releases }}"
  loop_control:
    label: "Release: {{ item }}"
  tags: [bootstrap, releases]

- name: Create deployments tree
  ansible.builtin.file:
    path: "/root/{{ item.name }}"
    state: directory
    owner: root
    group: wheel
    mode: "{{ item.mode }}"
  loop:
    - name: deployments
      mode: "0755"
    - name: deployments/scripts
      mode: "0755"
    - name: deployments/services
      mode: "0750"
  tags: [deployments]

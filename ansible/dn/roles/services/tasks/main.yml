---
- name: Sync time on boot
  community.general.sysrc:
    name: ntpd_sync_on_start
    state: present
    value: "YES"
  tags: [ntpd, config]

- name: Start ntpd
  ansible.builtin.service:
    name: ntpd
    enabled: true
    state: started
  tags: [ntpd]

- name: Set NFS caching to 5 seconds
  community.general.sysrc:
    name: nfs_access_cache
    state: present
    value: 5
  tags: [nfs, config]

- name: Start NFS client
  ansible.builtin.service:
    name: nfsclient
    pattern: nfscl
    enabled: true
    state: started
  tags: [nfs]

- name: Mount services share
  ansible.posix.mount:
    fstype: nfs
    src: "{{ services_share.host }}:{{ services_share.src }}"
    path: "{{ services_share.dst }}"
    opts: nfsv4,rw,bgnow,nolockd
    state: mounted
  tags: [services, nfs, mount, config]

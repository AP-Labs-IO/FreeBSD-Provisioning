---
- name: Start rtsold
  ansible.builtin.service:
    name: rtsold
    enabled: true
    state: started
  tags: [rtsold, config]

- name: Configure cloned interfaces
  community.general.sysrc:
    name: cloned_interfaces
    state: present
    value: "{{ interfaces | map(attribute='bridge.name') | join(' ') }}"
  register: network_reg_cloned
  tags: [interfaces, cloned, config]

- name: Rename source interfaces
  community.general.sysrc:
    name: "ifconfig_{{ item.source }}_name"
    state: present
    value: "{{ item.target }}"
  loop: "{{ interfaces }}"
  loop_control:
    label: "Renaming interface: {{ item.source }} -> {{ item.target }}"
  register: network_reg_rename
  tags: [interfaces, rename, config]

- name: Configure bridges IPv4
  community.general.sysrc:
    name: "ifconfig_{{ item.bridge.name }}"
    state: present
    value: "addm {{ item.target }} up stp {{ item.target }}{% if item.bridge.ip4 is defined %} {{ item.bridge.ip4 }}{% endif %}"
  loop: "{{ interfaces }}"
  loop_control:
    label: "Configuring bridge IPv4: {{ item.bridge.name }}"
  register: network_reg_bridges_ip4
  tags: [bridge, ipv4, config]

- name: Configure bridges IPv6
  community.general.sysrc:
    name: "ifconfig_{{ item.bridge.name }}_ipv6"
    state: present
    value: "inet6 {{ item.bridge.ip6 }}"
  loop: "{{ interfaces }}"
  loop_control:
    label: "Configuring bridge IPv6: {{ item.bridge.name }}"
  when: item.bridge.ip6 is defined
  register: network_reg_bridges_ip6
  tags: [bridge, ipv6, config]

- name: Activate target interfaces
  community.general.sysrc:
    name: "ifconfig_{{ item.target }}"
    state: present
    value: "up"
  loop: "{{ interfaces }}"
  loop_control:
    label: "Link state up: {{ item.target }}"
  register: network_reg_activate
  tags: [interfaces, link, config]

- name: Reboot
  ansible.builtin.reboot:
    msg: Rebooting to activate new network settings
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
  when: >
    (network_reg_cloned.changed | default(false) | bool) or
    (network_reg_rename.changed | default(false) | bool) or
    (network_reg_bridges_ip4.changed | default(false) | bool) or
    (network_reg_bridges_ip6.changed | default(false) | bool) or
    (network_reg_activate.changed | default(false) | bool)
  tags: [reboot]

- name: Disable packet filtering on bridge interfaces
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    state: present
    value: "{{ item.value }}"
  loop:
    - key: net.link.bridge.pfil_bridge
      value: 0
      description: Prevent packet filtering on bridge interfaces
    - key: net.link.bridge.pfil_member
      value: 0
      description: Prevent packet filtering on interfaces members of a bridge
  loop_control:
    label: "{{ item.description }}: {{ item.key }} -> {{ item.value }}"
  tags: [kernel, config]

---
- name: Applying OS patches
  ansible.builtin.command: freebsd-update --not-running-from-cron fetch install
  environment:
    PAGER: cat
  register: patch_reg_update_output
  changed_when: "'Installing updates:' in patch_reg_update_output.stdout"
  failed_when:
    - patch_reg_update_output.rc != 0
    - "'No updates needed' not in patch_reg_update_output.stdout"
  tags:
    - update
    - patching
    - freebsd-update

- name: Rebooting
  ansible.builtin.reboot:
    msg: Rebooting to apply OS patches
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
  when: >
    (patch_reg_update_output.changed | default(false) | bool) or
    (force_reboot | default(false) | bool)
  tags:
    - patching
    - reboot

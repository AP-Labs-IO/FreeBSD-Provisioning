---
- name: Check if Python is installed
  ansible.builtin.raw: "ASSUME_ALWAYS_YES=yes pkg info -eq lang/python3"
  register: bootstrap_python_check
  failed_when: false
  changed_when: false
  tags:
    - base-packages

- name: Install Python
  ansible.builtin.raw: "pkg install -y lang/python3"
  when: bootstrap_python_check.rc != 0
  changed_when: true
  tags:
    - base-packages

- name: Gather facts
  ansible.builtin.setup:
  tags:
    - facts

- name: Add root SSH key
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('ansible.builtin.file', 'root_ed25519.pub') }}"
  tags:
    - ssh
    - keys
    - root
  no_log: "{{ disable_sensitive_logging }}"

- name: Prohibit password-based SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Enable key-based only SSH authentication for root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
  notify: Restart sshd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Create pkg repos directory
  ansible.builtin.file:
    path: /usr/local/etc/pkg/repos
    state: directory
    mode: "0755"
  tags:
    - pkg
    - latest-repo

- name: Configure 'latest' pkg repository
  ansible.builtin.copy:
    dest: /usr/local/etc/pkg/repos/FreeBSD.conf
    content: |
      FreeBSD: {
          url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest"
      }
    mode: "0644"
  tags:
    - pkg
    - latest-repo

- name: Install base packages
  community.general.pkgng:
    name:
      - lang/python3
      - shells/bash
      - shells/bash-completion
      - shells/bash-completion-freebsd
      - shells/bash-completion-zfs
    state: latest
  tags:
    - base-packages

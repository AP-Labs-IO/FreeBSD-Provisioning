---
- name: Checking if Python is installed
  ansible.builtin.raw: ASSUME_ALWAYS_YES=yes pkg info -eq lang/python3
  register: bootstrap_reg_python_check
  failed_when: false
  changed_when: false
  tags:
    - base-packages

- name: Installing Python
  ansible.builtin.raw: pkg install -y lang/python3
  when: bootstrap_reg_python_check.rc != 0
  changed_when: true
  tags:
    - base-packages

- name: Gathering facts
  ansible.builtin.setup:
  tags:
    - facts

- name: Adding root SSH key
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('ansible.builtin.file', 'keys/root_ed25519.pub') }}"
  tags:
    - ssh
    - keys
    - root
  no_log: "{{ disable_sensitive_logging }}"

- name: Prohibiting password-based SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?PasswordAuthentication"
    line: PasswordAuthentication no
  notify: Restart sshd

- name: Enabling key-based only SSH authentication for root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?PermitRootLogin"
    line: PermitRootLogin prohibit-password
  notify: Restart sshd

- name: Flushing handlers
  ansible.builtin.meta: flush_handlers

- name: Creating pkg repos directory
  ansible.builtin.file:
    path: /usr/local/etc/pkg/repos
    state: directory
    mode: "0755"
  tags:
    - pkg
    - latest-repo

- name: Configuring 'latest' pkg repository
  ansible.builtin.copy:
    dest: /usr/local/etc/pkg/repos/FreeBSD.conf
    content: |
      FreeBSD: {
          url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest"
      }
    mode: "0644"
  tags:
    - pkg
    - latest-repo

- name: Installing base packages
  community.general.pkgng:
    name:
      - lang/python3
      - shells/bash
      - shells/bash-completion
      - shells/bash-completion-freebsd
      - shells/bash-completion-zfs
    state: latest
  tags:
    - base-packages

- name: Creating admin accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment }}"
    groups: wheel
    append: true
    shell: "{{ item.shell }}"
    password: "{{ item.password | ansible.builtin.password_hash(hashtype='sha512', salt=item.salt) }}"
    update_password: on_create
  loop: "{{ admins }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - admins
    - accounts
  no_log: "{{ disable_sensitive_logging }}"

- name: Adding admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('ansible.builtin.file', 'keys/' + item.name + '_' + item.key_type + '.pub') }}"
  loop: "{{ admins }}"
  tags:
    - admins
    - ssh
    - keys
  no_log: "{{ disable_sensitive_logging }}"

---
- name: Check if Python is installed
  ansible.builtin.raw: ASSUME_ALWAYS_YES=yes pkg info -eq lang/python3
  register: bootstrap_reg_python_check
  failed_when: false
  changed_when: false
  tags: [packages, python]

- name: Install Python
  ansible.builtin.raw: pkg install -y lang/python3
  when: bootstrap_reg_python_check.rc != 0
  changed_when: true
  tags: [packages, python]

- name: Gather facts
  ansible.builtin.setup:
  tags: [facts]

- name: Load OS version-specific role constants
  ansible.builtin.include_vars:
    file: "freebsd_{{ ansible_facts['distribution_major_version'] }}.yml"
  tags: [config]

- name: Start sshd
  ansible.builtin.service:
    name: sshd
    enabled: true
    state: started
  tags: [ssh]

- name: Add root SSH key
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('ansible.builtin.file', 'keys/root_ed25519.pub') }}"
  no_log: "{{ bootstrap_disable_sensitive_logging }}"
  tags: [ssh, keys]

- name: Disable password-based SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?PasswordAuthentication"
    line: PasswordAuthentication no
  notify: Restart sshd
  tags: [ssh, config]

- name: Enable key-based only SSH authentication for root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(?i)^#?PermitRootLogin"
    line: PermitRootLogin prohibit-password
  notify: Restart sshd
  tags: [ssh, config]

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: [ssh]

- name: Create pkg repos directory
  ansible.builtin.file:
    path: /usr/local/etc/pkg/repos
    state: directory
    mode: "0755"
  tags: [pkg, config]

- name: Configure 'latest' pkg ports repository
  ansible.builtin.copy:
    dest: /usr/local/etc/pkg/repos/FreeBSD.conf
    content: |
      {{ bootstrap_ports_repository_name }}: {
          url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest"
      }
    owner: root
    group: wheel
    mode: "0644"
  tags: [pkg, config]

- name: Install core packages
  community.general.pkgng:
    pkgsite: "{{ bootstrap_ports_repository_name }}"
    name:
      - lang/python3
      - shells/bash
      - shells/bash-completion
      - shells/bash-completion-freebsd
      - shells/bash-completion-zfs
    state: latest
    cached: false
  tags: [packages]

- name: Create admin accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment }}"
    groups: wheel
    append: true
    shell: "{{ item.shell }}"
    password: "{{ item.password | ansible.builtin.password_hash(hashtype='sha512', salt=item.salt) }}"
    update_password: on_create
  loop: "{{ admins }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: "{{ bootstrap_disable_sensitive_logging }}"
  tags: [admins, accounts]

- name: Add admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('ansible.builtin.file', 'keys/' + item.name + '_' + item.key_type + '.pub') }}"
  loop: "{{ admins }}"
  loop_control:
    label: "{{ item.name }} ({{ item.key_type }})"
  no_log: "{{ bootstrap_disable_sensitive_logging }}"
  tags: [admins, ssh, keys]

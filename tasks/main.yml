---
- name: Configure local base fact
  tags: [local-base, facts]
  block:
    - name: Query local base
      ansible.builtin.command: sysctl -n user.localbase
      register: bastille_reg_local_base
      changed_when: false

    - name: Set local base fact
      ansible.builtin.set_fact:
        local_base: "{{ bastille_reg_local_base.stdout }}"
        cacheable: true

- name: Load OS version-specific role constants
  ansible.builtin.include_vars:
    file: "freebsd_{{ ansible_facts['distribution_major_version'] }}.yml"
  tags: [config]

- name: Install packages
  community.general.pkgng:
    name:
      - devel/git
      - sysutils/bastille
      - sysutils/htop
      - sysutils/tree
    state: latest
    use_globs: false
  tags: [pkg]

- name: Install Bastille configuration
  ansible.builtin.template:
    src: bastille.conf.j2
    dest: "{{ ansible_facts['local_base'] }}/etc/bastille/bastille.conf"
    owner: root
    group: wheel
    mode: "0644"
  tags: [config]

- name: Enable Bastille service
  community.general.sysrc:
    name: bastille_enable
    state: present
    value: "YES"
  tags: [config]

- name: Configure jail startup delay
  community.general.sysrc:
    name: bastille_startup_delay
    state: present
    value: 5
  tags: [config]

- name: Bootstrap FreeBSD releases
  ansible.builtin.command:
    cmd: "bastille bootstrap {{ bastille_bootstrap_flags }} {{ item }}"
    creates: "{{ bastille_prefix }}/releases/{{ item }}/COPYRIGHT"
  register: bastille_reg_bootstrap_releases
  changed_when: "'skipped' not in bastille_reg_bootstrap_releases.stdout"
  loop: "{{ bastille_releases }}"
  loop_control:
    label: "Release: {{ item }}"
  tags: [releases]

- name: Create deployments tree
  ansible.builtin.file:
    path: "{{ bastille_ops_path }}/{{ item.name }}"
    state: directory
    owner: root
    group: wheel
    mode: "{{ item.mode }}"
  loop:
    - name: deployments/scripts
      mode: "0755"
    - name: deployments/services
      mode: "0750"
  tags: [deployments]

- name: Copy jails creation script
  ansible.builtin.template:
    src: create-jail.sh
    dest: "{{ bastille_ops_path }}/deployments/scripts/create-bastille-jail.sh"
    owner: root
    group: wheel
    mode: "0755"
  tags: [deployments, script]

---
- name: Start rtsold
  ansible.builtin.service:
    name: rtsold
    enabled: true
    state: started
  when: network_enable_rtsold
  tags: [rtsold, config]

- name: Remove stock configuration
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: "(?i)^ifconfig_(?!({{ network_preserve_custom_configurations }}))"
    state: absent
  when: network_remove_stock_configuration
  tags: [reset, config]

- name: Rename interfaces
  community.general.sysrc:
    name: "ifconfig_{{ item.src }}_name"
    state: present
    value: "{{ item.dst }}"
  loop: "{{ network_renamed_interfaces }}"
  loop_control:
    label: "Renaming interface: {{ item.src }} -> {{ item.dst }}"
  register: network_reg_rename
  tags: [interfaces, rename, config]

- name: Configure base interfaces IPv4
  community.general.sysrc:
    name: "ifconfig_{{ item.name }}"
    state: present
    value: "{{ ('DHCP' in item.ip4) | ternary(item.ip4, 'inet %s up' | format(item.ip4)) }}"
  loop: "{{ network_base_interfaces }}"
  loop_control:
    label: "Configuring base interfaces IPv4: {{ item.name }} -> {{ item.ip4 }}"
  when: item.ip4 is defined
  register: network_reg_base_ip4
  tags: [interfaces, base, ipv4, config]

- name: Configure base interfaces IPv6
  community.general.sysrc:
    name: "ifconfig_{{ item.name }}_ipv6"
    state: present
    value: "inet6 {{ item.ip6 }}"
  loop: "{{ network_base_interfaces }}"
  loop_control:
    label: "Configuring base interfaces IPv6: {{ item.name }} -> {{ item.ip6 }}"
  when: item.ip6 is defined
  register: network_reg_base_ip6
  tags: [interfaces, base, ipv6, config]

- name: Create VLAN interfaces
  community.general.sysrc:
    name: "vlans_{{ item.parent }}"
    state: present
    value: "{{ item.vlans | map(attribute='tag') | list | join(' ') }}"
  loop: "{{ network_vlan_interfaces }}"
  loop_control:
    label: "Configuring VLANs for parent: {{ item.parent }}"
  register: network_reg_vlans_create
  tags: [interfaces, vlan, config]

- name: Configure VLANs IPv4
  community.general.sysrc:
    name: "ifconfig_{{ item.parent }}_{{ item.tag }}"
    state: present
    value: "{{ item.ip4 }}"
  vars:
    vlans_matrix: >-
        [
          {% for row in network_vlan_interfaces %}
            {% for vlan in row.vlans %}
              {
                "parent": "{{ row.parent }}",
                "tag": "{{ vlan.tag }}",
                "ip4": "{%- if vlan.ip4 is defined -%}
                          {{- ('DHCP' in vlan.ip4) | ternary(vlan.ip4, 'inet %s up' | format(vlan.ip4)) -}}
                        {%- else -%}
                          up
        {%- endif -%}"
              },
            {% endfor %}
          {% endfor %}
        ]
  loop: "{{ vlans_matrix | from_yaml | default([]) }}"
  loop_control:
    label: "Configuring VLAN IPv4: {{ item.parent }}.{{ item.tag }} -> {{ item.ip4 }}"
  register: network_reg_vlans_ip4
  tags: [interfaces, vlan, ipv4, config]

- name: Configure VLANs IPv6
  community.general.sysrc:
    name: "ifconfig_{{ item.parent }}_{{ item.tag }}_ipv6"
    state: present
    value: "inet6 {{ item.ip6 }}"
  vars:
    vlans_matrix: >-
        [
          {% for row in network_vlan_interfaces %}
            {% for vlan in row.vlans %}
              {
                "parent": "{{ row.parent }}",
                "tag": "{{ vlan.tag }}",
        {%- if vlan.ip6 is defined and vlan.ip6 | length > 0 -%}
                "ip6": "{{ vlan.ip6 }}"
        {%- endif -%}
              },
            {% endfor %}
          {% endfor %}
        ]
  loop: "{{ vlans_matrix | from_yaml | default([]) }}"
  loop_control:
    label: "Configuring VLAN IPv6: {{ item.parent }}.{{ item.tag }} -> {{ item.ip6 }}"
  when: item.ip6 is defined
  register: network_reg_vlans_ip6
  tags: [interfaces, vlan, ipv6, config]

- name: Configure cloned interfaces
  community.general.sysrc:
    name: cloned_interfaces
    state: "{{ (cloned_interfaces | length > 0) | ternary('present', 'absent') }}"
    value: "{{ cloned_interfaces | join(' ') }}"
  vars:
    cloned_interfaces: "{{ network_bridge_interfaces | default([]) | map(attribute='name', default='') | reject('==', '') | list }}"
  register: network_reg_cloned
  tags: [interfaces, cloned, config]

- name: Configure bridges IPv4
  community.general.sysrc:
    name: "ifconfig_{{ item.name }}"
    state: present
    value: "{% if item.ip4 is defined %}{{ ('DHCP' in item.ip4) | ternary(item.ip4, 'inet %s' | format(item.ip4)) }}{% endif %}
      addm {{ item.members | join(' addm ') }} stp {{ item.members | first }} up"
  loop: "{{ network_bridge_interfaces | default([]) }}"
  loop_control:
    label: "Configuring bridge IPv4: {{ item.name }} -> Members: {{ item.members | join(', ') }}"
  register: network_reg_bridges_ip4
  tags: [interfaces, bridge, ipv4, config]

- name: Configure bridges IPv6
  community.general.sysrc:
    name: "ifconfig_{{ item.name }}_ipv6"
    state: present
    value: "inet6 {{ item.ip6 }}"
  loop: "{{ network_bridge_interfaces | default([]) }}"
  loop_control:
    label: "Configuring bridge IPv6: {{ item.name }}"
  when: item.ip6 is defined
  register: network_reg_bridges_ip6
  tags: [interfaces, bridge, ipv6, config]

- name: Activate interfaces
  community.general.sysrc:
    name: "ifconfig_{{ item | replace('.', '_') }}"
    state: present
    value: "up"
  loop: "{{ target_interfaces | unique | list }}"
  vars:
    renamed_interfaces: "{{ network_renamed_interfaces | map(attribute='dst') | list }}"
    base_interfaces: "{{ network_base_interfaces | map(attribute='name') | list }}"
    vlan_interfaces: "{{ network_vlan_interfaces | map(attribute='parent') | list }}"
    bridge_members: >-
      {%- if network_bridge_interfaces is defined -%}
        {{ network_bridge_interfaces | json_query('[].members') | flatten | to_json }}
      {%- else -%}
        []
      {%- endif -%}
    preliminary_interfaces: "{{ (renamed_interfaces + vlan_interfaces + (bridge_members | from_yaml)) | unique | list }}"
    target_interfaces: "{{ preliminary_interfaces | difference(base_interfaces) }}"
  loop_control:
    label: "Link state up: {{ item }}"
  register: network_reg_activate
  tags: [interfaces, link, config]

- name: Configure default route IPv4
  community.general.sysrc:
    name: defaultrouter
    state: "{{ network_default_route_ipv4 is defined | ternary('present', 'absent') }}"
    value: "{{ network_default_route_ipv4 | default('') }}"
  register: network_reg_default_route_ipv4
  tags: [route, config, ipv4]

- name: Configure default route IPv6
  community.general.sysrc:
    name: ipv6_defaultrouter
    state: "{{ network_default_route_ipv6 is defined | ternary('present', 'absent') }}"
    value: "{{ network_default_route_ipv6 | default('') }}"
  register: network_reg_default_route_ipv6
  tags: [route, config, ipv6]

- name: Configure DNS resolver
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: wheel
    mode: "0644"
    content: |
      {% if network_dns_resolver.domain is defined and network_dns_resolver.domain | length > 0 %}
      domain {{ network_dns_resolver.domain }}
      {% endif %}
      {% if network_dns_resolver.search is defined and network_dns_resolver.search | length > 0 %}
      search {{ network_dns_resolver.search }}
      {% endif %}
      {% if network_dns_resolver.nameservers is defined and network_dns_resolver.nameservers | length > 0 %}
      {% for ns in network_dns_resolver.nameservers %}
      nameserver {{ ns }}
      {% endfor %}
      {% endif %}
      {% if network_dns_resolver.options is defined and network_dns_resolver.options | length > 0 %}
      options {{ network_dns_resolver.options }}
      {% endif %}
  when: network_dns_resolver is defined
  notify:
    - Disable dynamic DNS resolver reconfiguration
    - Apply new resolvconf configuration
  tags: [network, resolver, config]

- name: Force execution of notified handlers
  ansible.builtin.meta: flush_handlers
  tags: [network, resolver, config]

- name: Reboot
  ansible.builtin.reboot:
    msg: Rebooting to activate new network settings
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
  when: >
    (network_reg_rename.changed | default(false) | bool) or
    (network_reg_base_ip4.changed | default(false) | bool) or
    (network_reg_base_ip6.changed | default(false) | bool) or
    (network_reg_vlans_create.changed | default(false) | bool) or
    (network_reg_vlans_ip4.changed | default(false) | bool) or
    (network_reg_vlans_ip6.changed | default(false) | bool) or
    (network_reg_cloned.changed | default(false) | bool) or
    (network_reg_bridges_ip4.changed | default(false) | bool) or
    (network_reg_bridges_ip6.changed | default(false) | bool) or
    (network_reg_activate.changed | default(false) | bool) or
    (network_reg_default_route_ipv4.changed | default(false) | bool) or
    (network_reg_default_route_ipv6.changed | default(false) | bool)
  tags: [reboot]

- name: Disable packet filtering on bridge interfaces
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    state: present
    value: "{{ item.value }}"
  loop:
    - key: net.link.bridge.pfil_bridge
      value: 0
      description: Prevent packet filtering on bridge interfaces
    - key: net.link.bridge.pfil_member
      value: 0
      description: Prevent packet filtering on interfaces members of a bridge
  loop_control:
    label: "{{ item.description }}: {{ item.key }} -> {{ item.value }}"
  when: network_disable_bridge_filtering
  tags: [kernel, config]

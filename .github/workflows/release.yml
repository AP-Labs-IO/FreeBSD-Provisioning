---
name: Release Collection to Ansible Galaxy

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

jobs:
  publish:
    name: Lint, Build, and Publish to Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core, ansible-lint, and antsibull-changelog
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint antsibull-changelog

      - name: Install collection dependencies from galaxy.yml
        run: |
          yq '.dependencies | to_entries | map(.key + ":" + .value) | .[]' galaxy.yml \
            | xargs -r ansible-galaxy collection install

      - name: Run ansible-lint
        run: |
          ansible-lint

      - name: Lint changelog
        run: |
          antsibull-changelog lint

      - name: Verify Git tag matches galaxy.yml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GALAXY_VERSION=$(yq '.version' galaxy.yml)
          if [ "$TAG_VERSION" != "$GALAXY_VERSION" ]; then
            echo "Error: Git tag ($TAG_VERSION) does not match galaxy.yml version ($GALAXY_VERSION)"
            exit 1
          fi

      - name: Build collection tarball
        run: |
          ansible-galaxy collection build

      - name: Publish collection to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
        run: |
          ansible-galaxy collection publish ap_labs-freebsd_provisioning-*.tar.gz --token "$ANSIBLE_GALAXY_TOKEN"

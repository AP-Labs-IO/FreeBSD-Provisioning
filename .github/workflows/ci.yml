---
name: CI Linting

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Lint (ansible-core ${{ matrix.ansible-core }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible-core: ['~=2.19.0', '~=2.20.0']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core, ansible-lint, and antsibull-changelog
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core${{ matrix.ansible-core }}" ansible-lint antsibull-changelog

      - name: Install collection dependencies from galaxy.yml
        run: |
          ansible-galaxy collection install -r galaxy.yml

      - name: Run ansible-lint
        run: |
          ansible-lint

      - name: Lint changelog
        run: |
          antsibull-changelog lint
